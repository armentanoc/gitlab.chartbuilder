<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitLab Contributions Chart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>GitLab Contributions Chart</h1>
        <p>PS.: to get your GitLab contributions' JSON go to:
            <br>https://gitlab.<code>{{your_company_url}}</code>/users/<code>{{your_user_name}}</code>/calendar.json
        <br><br><label for="year-input">Year:</label>
        <select id="year-input"></select>
        </p>
        <textarea id="json-input" rows="10" cols="50"
            placeholder="Paste your JSON string here or upload a JSON file below"></textarea><br>
        <br><input type="file" id="file-input" accept=".json">
        <div class="svg-container" id="calendar-svg"></div>
        <div id="error-message"></div>
    </div>
    <footer>
        <a href="https://github.com/armentanoc" target="_blank" rel="noopener noreferrer">GitHub (@armentanoc)</a>
        <button id="download-btn">Download PNG</button>
        <a href="https://linkedin.com/in/armentanocarolina" target="_blank" rel="noopener noreferrer">LinkedIn
            (armentanocarolina)</a>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
